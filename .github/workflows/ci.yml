name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --cache /tmp/npm-cache

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true  # warnings only until we clear all TS errors

      - name: Lint
        run: npx eslint . --ext .ts,.tsx --max-warnings 50
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          # Use secrets if set, fallback to placeholder so build doesn't fail
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-key' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'placeholder-anthropic-key' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'placeholder-openai-key' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 'placeholder-resend-key' }}
          NEXT_PUBLIC_ROOT_DOMAIN: habino.app
          NEXT_PUBLIC_DEV_TENANT_SLUG: demo
          # Sentry — leave empty in CI; real token only on Vercel for source maps
          SENTRY_AUTH_TOKEN: ""
          SENTRY_SUPPRESS_GLOBAL_ERROR_HANDLER_FILE_WARNING: "1"
